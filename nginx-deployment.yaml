apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-240497821
  labels:
    app: nginx
    student: "240497821"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
      student: "240497821"
  template:
    metadata:
      labels:
        app: nginx
        student: "240497821"
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
    student: "240497821"
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: NodePort
